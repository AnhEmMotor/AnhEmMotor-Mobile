name: Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Environment
        run: |
          echo "EXPO_PUBLIC_GOOGLE_MAPS_ANDROID_API_KEY=${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_ANDROID_API_KEY || 'dummy_android_key' }}" >> $GITHUB_ENV
          echo "EXPO_PUBLIC_BACKEND_API_URL=${{ secrets.EXPO_PUBLIC_BACKEND_API_URL || 'http://localhost' }}" >> $GITHUB_ENV
          echo "EXPO_PUBLIC_GOOGLE_MAPS_IOS_API_KEY=${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_IOS_API_KEY || 'dummy_ios_key' }}" >> $GITHUB_ENV

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/AnhEmMotor-Latest-Release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnhEmMotor-Latest-Release
          path: android/app/build/outputs/apk/release/AnhEmMotor-Latest-Release.apk

  release:
    name: Update Release
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: AnhEmMotor-Latest-Release
          path: release-files/

      - name: Move tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Release Files
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Release
          files: release-files/AnhEmMotor-Latest-Release.apk
          make_latest: true
